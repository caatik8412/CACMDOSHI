<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outstanding Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --c-primary: #1a3a5c;
  --c-primary-light: #e8f0f8;
  --c-accent: #2563a8;
  --c-border: #e2e8f0;
  --c-bg: #f1f5f9;
  --c-text: #0f172a;
  --c-muted: #64748b;
  --c-success: #16a34a;
  --c-danger: #dc2626;
  --c-total-bg: #1a3a5c;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--c-bg); color: var(--c-text); font-size: 14px; min-height: 100vh; }

.header { background: var(--c-primary); color: #fff; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
.header-title { font-size: 16px; font-weight: 600; }
.header-firms { display: flex; gap: 6px; flex-wrap: wrap; }
.firm-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }

.summary-strip { display: flex; gap: 12px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--c-border); overflow-x: auto; }
.sum-card { flex: 1; min-width: 130px; text-align: center; padding: 10px 8px; border-radius: var(--radius-sm); }
.sum-card.total-card { background: var(--c-total-bg); }
.sum-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
.sum-card.total-card .sum-label { color: #93c5fd; }
.sum-card.total-card .sum-amount { color: #fff; }
.sum-amount { font-size: 17px; font-weight: 700; }

.toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: #fff; border-bottom: 1px solid var(--c-border); flex-wrap: wrap; }
.search-box { position: relative; flex: 1; max-width: 300px; }
.search-box i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--c-muted); font-size: 15px; }
.search-box input { width: 100%; padding: 7px 10px 7px 32px; border: 1px solid var(--c-border); border-radius: var(--radius-sm); font-size: 13px; outline: none; background: var(--c-bg); }
.search-box input:focus { border-color: var(--c-accent); background: #fff; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
.btn-primary { background: var(--c-accent); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-outline { background: #fff; color: var(--c-text); border: 1px solid var(--c-border); }
.btn-outline:hover { background: var(--c-bg); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.table-wrap { padding: 16px 24px; }
.table-container { background: #fff; border-radius: var(--radius); border: 1px solid var(--c-border); overflow: auto; box-shadow: var(--shadow-sm); }
table { width: 100%; border-collapse: collapse; }
thead th { padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--c-muted); background: #f8fafc; border-bottom: 1px solid var(--c-border); white-space: nowrap; }
thead th.right { text-align: right; }
tr.group-row td { background: var(--c-primary); color: #fff; padding: 6px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
tr.group-row td i { margin-right: 6px; font-size: 13px; vertical-align: -2px; opacity: 0.8; }
tr.client-row { border-bottom: 1px solid var(--c-border); transition: background 0.1s; }
tr.client-row:last-child { border-bottom: none; }
tr.client-row:hover { background: #f8fafc; }
tr.client-row td { padding: 8px 12px; vertical-align: middle; }
.client-name { font-weight: 500; font-size: 13px; }
.status-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-top: 2px; }
.amt { text-align: right; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.zero { color: #cbd5e1; font-weight: 400; }
.amt.total-amt { color: #1a3a5c; font-weight: 700; }
.actions { display: flex; gap: 5px; justify-content: flex-end; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--radius-sm); border: 1px solid var(--c-border); background: #fff; cursor: pointer; font-size: 14px; transition: all 0.15s; color: var(--c-muted); }
.icon-btn:hover { background: var(--c-bg); color: var(--c-text); }
.icon-btn.bill:hover { border-color: var(--c-accent); color: var(--c-accent); }
.icon-btn.receipt:hover { border-color: var(--c-success); color: var(--c-success); }
.icon-btn.ledger:hover { border-color: #7c3aed; color: #7c3aed; }
.outstanding-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; }
.outstanding-badge.high { background: #fef2f2; color: var(--c-danger); }
.outstanding-badge.med  { background: #fffbeb; color: #b45309; }
.outstanding-badge.low  { background: #f0fdf4; color: var(--c-success); }
.loading-row td { text-align: center; padding: 40px; color: var(--c-muted); }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.1); border-top-color: var(--c-accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: var(--radius); width: 560px; max-width: 96vw; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-md); }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--c-border); position: sticky; top: 0; background: #fff; z-index: 1; }
.modal-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.modal-close { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--c-muted); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); }
.modal-close:hover { background: var(--c-bg); }
.modal-body { padding: 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--c-border); display: flex; justify-content: flex-end; gap: 8px; }
.client-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--c-primary-light); border: 1px solid #bfdbfe; border-radius: 20px; padding: 5px 14px; margin-bottom: 18px; font-size: 13px; font-weight: 600; color: var(--c-primary); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.span2 { grid-column: span 2; }
label { font-size: 11px; font-weight: 600; color: var(--c-muted); text-transform: uppercase; letter-spacing: 0.5px; }
input[type=text], input[type=number], input[type=date], select, textarea { padding: 8px 10px; border: 1px solid var(--c-border); border-radius: var(--radius-sm); font-size: 13px; outline: none; font-family: inherit; background: #fff; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--c-accent); box-shadow: 0 0 0 2px rgba(37,99,168,0.12); }
textarea { resize: vertical; min-height: 60px; }
.form-divider { grid-column: span 2; border: none; border-top: 1px solid var(--c-border); margin: 2px 0; }
.items-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.items-table th { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--c-muted); padding: 6px 8px; background: #f8fafc; border: 1px solid var(--c-border); text-align: left; }
.items-table td { padding: 5px 6px; border: 1px solid var(--c-border); }
.items-table input { border: none; padding: 4px 6px; font-size: 13px; width: 100%; outline: none; background: transparent; }
.items-table input:focus { background: #f0f7ff; border-radius: 3px; }
.add-item-btn { display: inline-flex; align-items: center; gap: 5px; color: var(--c-accent); font-size: 12px; font-weight: 500; cursor: pointer; margin-top: 6px; background: none; border: none; padding: 0; }
.remove-row-btn { color: var(--c-danger); cursor: pointer; background: none; border: none; font-size: 15px; padding: 2px 4px; }
.bill-total-row { display: flex; justify-content: flex-end; gap: 20px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--c-border); }
.bill-total-label { font-size: 12px; color: var(--c-muted); }
.bill-total-amt { font-size: 16px; font-weight: 700; color: var(--c-primary); }
.ledger-entry { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--c-border); }
.ledger-entry:last-child { border-bottom: none; }
.ledger-date { font-size: 11px; color: var(--c-muted); }
.ledger-desc { font-size: 13px; font-weight: 500; }
.ledger-firm-tag { display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 10px; margin-top: 3px; font-weight: 600; }
.ledger-debit { color: var(--c-danger); font-weight: 700; font-size: 13px; text-align: right; }
.ledger-credit { color: var(--c-success); font-weight: 700; font-size: 13px; text-align: right; }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--c-primary); color: #fff; padding: 11px 18px; border-radius: var(--radius); font-size: 13px; box-shadow: var(--shadow-md); z-index: 9999; display: none; align-items: center; gap: 8px; }
.toast.show { display: flex; }
.toast.success { background: var(--c-success); }
.toast.error { background: var(--c-danger); }
</style>
</head>
<body>

<div class="header">
  <div class="header-title"><i class="ti ti-chart-bar-popular" style="margin-right:8px;opacity:.8"></i>Outstanding Tracker</div>
  <div class="header-firms" id="headerFirms"></div>
</div>

<div class="summary-strip" id="summaryStrip"></div>

<div class="toolbar">
  <div class="search-box">
    <i class="ti ti-search"></i>
    <input type="text" id="searchInput" placeholder="Search client or group…" oninput="renderTable()">
  </div>
  <button class="btn btn-outline" onclick="loadData()"><i class="ti ti-refresh"></i> Refresh</button>
  <button class="btn btn-outline" onclick="openAddClientModal()"><i class="ti ti-user-plus"></i> Add Client</button>
  <button class="btn btn-primary" onclick="exportCSV()"><i class="ti ti-download"></i> Export</button>
</div>

<div class="table-wrap">
  <div class="table-container">
    <table id="mainTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody">
        <tr class="loading-row"><td colspan="10"><div style="display:flex;align-items:center;justify-content:center;gap:10px;"><div class="spinner"></div> Loading…</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- BILL MODAL -->
<div class="modal-overlay" id="billModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" style="color:var(--c-accent)"><i class="ti ti-file-invoice"></i> Add Bill</div>
      <button class="modal-close" onclick="closeModal('billModal')"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="client-pill"><i class="ti ti-user"></i> <span id="bill-client-name">—</span></div>
      <div class="form-grid">
        <div class="form-group"><label>Bill Number</label><input type="text" id="bill-number" placeholder="e.g. CMD/25-26/001"></div>
        <div class="form-group"><label>Bill Date</label><input type="date" id="bill-date"></div>
        <div class="form-group"><label>Firm</label><select id="bill-firm"></select></div>
        <div class="form-group"><label>Service Period</label><input type="text" id="bill-period" placeholder="e.g. FY 2024-25"></div>
        <hr class="form-divider">
      </div>
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--c-muted);margin-bottom:8px;">Bill Items</div>
      <table class="items-table">
        <thead><tr><th style="width:48%">Description</th><th style="width:14%">HSN/SAC</th><th style="width:16%">Amount</th><th style="width:12%">GST%</th><th style="width:10%"></th></tr></thead>
        <tbody id="bill-items-body"></tbody>
      </table>
      <button class="add-item-btn" onclick="addItemRow()"><i class="ti ti-plus"></i> Add row</button>
      <div class="bill-total-row">
        <div><div class="bill-total-label">Taxable</div><div style="font-size:14px;font-weight:600;" id="bill-taxable">₹0</div></div>
        <div><div class="bill-total-label">GST</div><div style="font-size:14px;font-weight:600;" id="bill-gst-amt">₹0</div></div>
        <div><div class="bill-total-label">Total</div><div class="bill-total-amt" id="bill-grand-total">₹0</div></div>
      </div>
      <div class="form-grid" style="margin-top:14px;">
        <div class="form-group span2"><label>Narration / Notes</label><textarea id="bill-narration" placeholder="Optional…"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('billModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveBill()"><i class="ti ti-device-floppy"></i> Save Bill</button>
    </div>
  </div>
</div>

<!-- RECEIPT MODAL -->
<div class="modal-overlay" id="receiptModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" style="color:var(--c-success)"><i class="ti ti-receipt"></i> Add Receipt</div>
      <button class="modal-close" onclick="closeModal('receiptModal')"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="client-pill"><i class="ti ti-user"></i> <span id="receipt-client-name">—</span></div>
      <div class="form-grid">
        <div class="form-group"><label>Receipt Number</label><input type="text" id="receipt-number" placeholder="e.g. RV/25-26/001"></div>
        <div class="form-group"><label>Receipt Date</label><input type="date" id="receipt-date"></div>
        <div class="form-group"><label>Firm</label><select id="receipt-firm"></select></div>
        <div class="form-group"><label>Amount Received (₹)</label><input type="number" id="receipt-amount" placeholder="0" oninput="updateReceiptBalance()"></div>
        <div class="form-group"><label>Mode of Payment</label>
          <select id="receipt-mode">
            <option>Bank Transfer (NEFT/RTGS)</option><option>UPI</option><option>Cheque</option><option>Cash</option><option>IMPS</option>
          </select>
        </div>
        <div class="form-group"><label>Reference / UTR / Cheque No.</label><input type="text" id="receipt-ref" placeholder="Transaction reference"></div>
        <div class="form-group span2" id="receipt-balance-row" style="display:none;background:var(--c-bg);padding:10px;border-radius:var(--radius-sm);">
          <div style="display:flex;justify-content:space-between;"><span style="font-size:12px;color:var(--c-muted);">Outstanding before</span><span style="font-weight:600;" id="receipt-outstanding-before">₹0</span></div>
          <div style="display:flex;justify-content:space-between;margin-top:6px;"><span style="font-size:12px;color:var(--c-muted);">Balance after receipt</span><span style="font-weight:700;font-size:15px;color:var(--c-success);" id="receipt-balance-after">₹0</span></div>
        </div>
        <div class="form-group span2"><label>Narration</label><textarea id="receipt-narration" placeholder="e.g. Received for Tax Audit FY 2024-25…"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('receiptModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveReceipt()" style="background:var(--c-success)"><i class="ti ti-device-floppy"></i> Save Receipt</button>
    </div>
  </div>
</div>

<!-- LEDGER MODAL -->
<div class="modal-overlay" id="ledgerModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title"><i class="ti ti-book" style="color:#7c3aed"></i> Client Ledger — <span id="ledger-client-name"></span></div>
      <button class="modal-close" onclick="closeModal('ledgerModal')"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="ledger-body"></div>
  </div>
</div>

<!-- ADD CLIENT MODAL -->
<div class="modal-overlay" id="addClientModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title"><i class="ti ti-user-plus" style="color:var(--c-accent)"></i> Add New Client</div>
      <button class="modal-close" onclick="closeModal('addClientModal')"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group span2"><label>Client Name *</label><input type="text" id="new-client-name" placeholder="Full name / firm name"></div>
        <div class="form-group span2"><label>Group Name (optional)</label><input type="text" id="new-client-group" placeholder="Leave blank if no group"></div>
        <div class="form-group"><label>PAN</label><input type="text" id="new-client-pan" placeholder="ABCDE1234F"></div>
        <div class="form-group"><label>Status</label>
          <select id="new-client-status">
            <option>44AB</option><option>44AD</option><option>8% BUSINESS</option>
            <option>PARTNER</option><option>DIRECTOR</option><option>OTHER</option><option>HUF</option><option>FIRM</option>
          </select>
        </div>
        <div class="form-group"><label>Mobile</label><input type="text" id="new-client-mobile" placeholder="10-digit number"></div>
        <div class="form-group"><label>Primary Firm</label><select id="new-client-firm"></select></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('addClientModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewClient()"><i class="ti ti-plus"></i> Add Client</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-check"></i> <span id="toast-msg"></span></div>

<script>
// Firms for CM Doshi & Associates group
const FIRMS = [
  { key: 'doshi',  label: 'CM Doshi',        color: '#1d4ed8', bg: '#eff6ff' },
  { key: 'phade',  label: 'PR Phade',         color: '#0f766e', bg: '#f0fdfa' },
  { key: 'prabha', label: 'Prabha Computers', color: '#7c3aed', bg: '#f5f3ff' },
];

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbywLxjndko9IgYNkvJBD1kcqiv_dUtYwXLhHl20-QCoibnsMBvETp8CnhvsuV1f1p2lVw/exec';

// ── STATE ────────────────────────────────────────────────────────────────
let allClients = [];
let currentClientId = null;
let currentClientName = '';
let currentClientOutstanding = 0;

// ── BOOT ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildFirmUI();
  setTodayDates();
  loadData();
});

// Build all firm-dependent UI from the FIRMS array
function buildFirmUI() {
  // Header badges
  document.getElementById('headerFirms').innerHTML =
    FIRMS.map(f => `<span class="firm-badge" style="background:${f.bg};color:${f.color}">${f.label}</span>`).join('');

  // Summary strip
  const strip = document.getElementById('summaryStrip');
  strip.innerHTML =
    FIRMS.map(f => `
      <div class="sum-card" style="background:${f.bg}">
        <div class="sum-label" style="color:${f.color}">${f.label}</div>
        <div class="sum-amount" style="color:${f.color}" id="total-${f.key}">₹0</div>
      </div>`).join('') +
    `<div class="sum-card total-card">
       <div class="sum-label">Grand Total</div>
       <div class="sum-amount" id="total-all">₹0</div>
     </div>`;

  // Table header
  document.getElementById('tableHead').innerHTML = `<tr>
    <th>Client</th>
    <th>Status</th>
    <th>Last Activity</th>
    ${FIRMS.map(f => `<th class="right" style="color:${f.color}">${f.label}</th>`).join('')}
    <th class="right" style="color:#1a3a5c">Total (₹)</th>
    <th class="right">Actions</th>
  </tr>`;

  // Firm dropdowns in all modals
  const firmOptions = FIRMS.map(f => `<option value="${f.label}">${f.label}</option>`).join('');
  ['bill-firm','receipt-firm','new-client-firm'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = firmOptions;
  });
}

function setTodayDates() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('bill-date').value = today;
  document.getElementById('receipt-date').value = today;
}

// ── DATA LOAD ─────────────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('tableBody').innerHTML =
    `<tr class="loading-row"><td colspan="${3 + FIRMS.length + 2}"><div style="display:flex;align-items:center;justify-content:center;gap:10px;"><div class="spinner"></div> Loading client data…</div></td></tr>`;
  try {
    const res  = await fetch(`${SCRIPT_URL}?action=getClients`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    allClients = data.clients || [];
    renderTable();
  } catch(e) {
    showToast('Failed to load: ' + e.message, 'error');
    renderTable();
  }
}

// ── TABLE ─────────────────────────────────────────────────────────────────
function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const tbody = document.getElementById('tableBody');

  const filtered = allClients.filter(c =>
    !q || c.name.toLowerCase().includes(q) || (c.group||'').toLowerCase().includes(q) || (c.pan||'').toLowerCase().includes(q)
  );

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="${3+FIRMS.length+2}" style="text-align:center;padding:40px;color:var(--c-muted);">No clients found.</td></tr>`;
    updateSummary([]);
    return;
  }

  // Group
  const groups = {}, noGroup = [];
  filtered.forEach(c => c.group ? (groups[c.group] = groups[c.group]||[], groups[c.group].push(c)) : noGroup.push(c));

  let rows = '';
  Object.entries(groups).forEach(([group, members]) => {
    rows += `<tr class="group-row"><td colspan="${3+FIRMS.length+2}"><i class="ti ti-folder"></i>${esc(group)}</td></tr>`;
    members.forEach(c => rows += clientRow(c));
  });
  if (noGroup.length) {
    rows += `<tr class="group-row" style="background:#475569"><td colspan="${3+FIRMS.length+2}"><i class="ti ti-user"></i>Other Clients</td></tr>`;
    noGroup.forEach(c => rows += clientRow(c));
  }

  tbody.innerHTML = rows;
  updateSummary(filtered);
}

function clientRow(c) {
  // Build per-firm amounts from client data using FIRMS keys
  // Apps Script returns keys matching FIRMS[i].key (doshi / phade / prabha / …)
  const firmAmts = FIRMS.map(f => c[f.key] || 0);
  const tot = firmAmts.reduce((a,b) => a+b, 0);
  const badge = tot > 50000 ? 'high' : tot > 15000 ? 'med' : 'low';

  const firmCols = FIRMS.map((f, i) => {
    const v = firmAmts[i];
    return `<td class="amt ${v>0?'':'zero'}" style="${v>0?'color:'+f.color:''}">
      ${v > 0 ? '₹'+fmt(v) : '—'}
    </td>`;
  }).join('');

  const statusColors = {
    '44AB':'background:#eff6ff;color:#1d4ed8','44AD':'background:#f0fdf4;color:#15803d',
    '8% BUSINESS':'background:#f5f3ff;color:#6d28d9','PARTNER':'background:#fff7ed;color:#c2410c',
    'DIRECTOR':'background:#fdf4ff;color:#7e22ce','OTHER':'background:#f8fafc;color:#475569;border:1px solid #e2e8f0',
    'HUF':'background:#fefce8;color:#854d0e','FIRM':'background:#ecfdf5;color:#065f46'
  };
  const sStyle = statusColors[c.status] || 'background:#f8fafc;color:#475569';

  return `<tr class="client-row">
    <td>
      <div class="client-name">${esc(c.name)}</div>
      ${tot > 0 ? `<span class="outstanding-badge ${badge}">${badge==='high'?'High':badge==='med'?'Mid':'Low'}</span>` : '<span style="font-size:11px;color:#cbd5e1;">Nil</span>'}
    </td>
    <td><span class="status-badge" style="${sStyle}">${esc(c.status||'—')}</span></td>
    <td style="font-size:12px;color:var(--c-muted);">${c.lastActivity||'—'}</td>
    ${firmCols}
    <td class="amt total-amt">${tot > 0 ? '₹'+fmt(tot) : '—'}</td>
    <td>
      <div class="actions">
        <button class="icon-btn bill" title="Add Bill" onclick="openBillModal('${c.id}','${esc(c.name)}')"><i class="ti ti-file-invoice"></i></button>
        <button class="icon-btn receipt" title="Add Receipt" onclick="openReceiptModal('${c.id}','${esc(c.name)}',${tot})"><i class="ti ti-receipt"></i></button>
        <button class="icon-btn ledger" title="View Ledger" onclick="openLedger('${c.id}','${esc(c.name)}')"><i class="ti ti-book"></i></button>
      </div>
    </td>
  </tr>`;
}

function updateSummary(clients) {
  FIRMS.forEach(f => {
    const total = clients.reduce((s,c) => s + (c[f.key]||0), 0);
    document.getElementById('total-'+f.key).textContent = '₹'+fmt(total);
  });
  const grand = clients.reduce((s,c) => s + FIRMS.reduce((a,f) => a+(c[f.key]||0), 0), 0);
  document.getElementById('total-all').textContent = '₹'+fmt(grand);
}

// ── BILL MODAL ────────────────────────────────────────────────────────────
function openBillModal(clientId, clientName) {
  currentClientId = clientId; currentClientName = clientName;
  document.getElementById('bill-client-name').textContent = clientName;
  document.getElementById('bill-number').value = '';
  document.getElementById('bill-period').value = '';
  document.getElementById('bill-narration').value = '';
  document.getElementById('bill-items-body').innerHTML = blankItemRow();
  calcBillTotal();
  openModal('billModal');
}

function blankItemRow() {
  return `<tr>
    <td><input type="text" placeholder="Service description"></td>
    <td><input type="text" placeholder="998231"></td>
    <td><input type="number" placeholder="0" class="item-amt" oninput="calcBillTotal()"></td>
    <td><input type="number" placeholder="18" class="item-gst" oninput="calcBillTotal()"></td>
    <td><button class="remove-row-btn" onclick="removeItemRow(this)"><i class="ti ti-x"></i></button></td>
  </tr>`;
}
function addItemRow() { document.getElementById('bill-items-body').insertAdjacentHTML('beforeend', blankItemRow()); }
function removeItemRow(btn) { if (document.querySelectorAll('#bill-items-body tr').length > 1) { btn.closest('tr').remove(); calcBillTotal(); } }
function calcBillTotal() {
  let taxable = 0, gst = 0;
  document.querySelectorAll('#bill-items-body tr').forEach(row => {
    const amt = parseFloat(row.querySelector('.item-amt').value)||0;
    const rate = parseFloat(row.querySelector('.item-gst').value)||0;
    taxable += amt; gst += amt * rate / 100;
  });
  document.getElementById('bill-taxable').textContent = '₹'+fmt(taxable);
  document.getElementById('bill-gst-amt').textContent = '₹'+fmt(gst);
  document.getElementById('bill-grand-total').textContent = '₹'+fmt(taxable+gst);
}

async function saveBill() {
  const billNo = document.getElementById('bill-number').value.trim();
  const billDate = document.getElementById('bill-date').value;
  const firm = document.getElementById('bill-firm').value;
  if (!billNo || !billDate) { showToast('Bill number and date are required.', 'error'); return; }
  let taxable = 0, gst = 0;
  const items = [];
  document.querySelectorAll('#bill-items-body tr').forEach(row => {
    const desc = row.cells[0].querySelector('input').value;
    const hsn  = row.cells[1].querySelector('input').value;
    const amt  = parseFloat(row.querySelector('.item-amt').value)||0;
    const gstR = parseFloat(row.querySelector('.item-gst').value)||0;
    taxable += amt; gst += amt*gstR/100;
    if (desc||amt) items.push({desc, hsn, amt, gstR});
  });
  await postToSheet({ action:'addBill', clientId:currentClientId, clientName:currentClientName,
    billNo, billDate, firm, period:document.getElementById('bill-period').value,
    description: items.map(i=>i.desc).filter(Boolean).join('; '),
    hsnSac: items[0]?.hsn||'', taxable, gstRate:items[0]?.gstR||0,
    narration:document.getElementById('bill-narration').value });
  closeModal('billModal');
  showToast(`Bill ₹${fmt(taxable+gst)} saved.`, 'success');
  loadData();
}

// ── RECEIPT MODAL ─────────────────────────────────────────────────────────
function openReceiptModal(clientId, clientName, outstanding) {
  currentClientId = clientId; currentClientName = clientName; currentClientOutstanding = outstanding;
  document.getElementById('receipt-client-name').textContent = clientName;
  document.getElementById('receipt-number').value = '';
  document.getElementById('receipt-amount').value = '';
  document.getElementById('receipt-ref').value = '';
  document.getElementById('receipt-narration').value = '';
  document.getElementById('receipt-balance-row').style.display = 'none';
  openModal('receiptModal');
}
function updateReceiptBalance() {
  const amt = parseFloat(document.getElementById('receipt-amount').value)||0;
  document.getElementById('receipt-outstanding-before').textContent = '₹'+fmt(currentClientOutstanding);
  document.getElementById('receipt-balance-after').textContent = '₹'+fmt(Math.max(0, currentClientOutstanding - amt));
  document.getElementById('receipt-balance-row').style.display = 'block';
}
async function saveReceipt() {
  const receiptNo = document.getElementById('receipt-number').value.trim();
  const receiptDate = document.getElementById('receipt-date').value;
  const amt = parseFloat(document.getElementById('receipt-amount').value)||0;
  const firm = document.getElementById('receipt-firm').value;
  if (!receiptNo || !receiptDate || !amt) { showToast('Receipt number, date and amount are required.', 'error'); return; }
  await postToSheet({ action:'addReceipt', clientId:currentClientId, clientName:currentClientName,
    receiptNo, receiptDate, firm, amount:amt,
    mode:document.getElementById('receipt-mode').value,
    ref:document.getElementById('receipt-ref').value,
    narration:document.getElementById('receipt-narration').value });
  closeModal('receiptModal');
  showToast(`Receipt ₹${fmt(amt)} saved.`, 'success');
  loadData();
}

// ── LEDGER ────────────────────────────────────────────────────────────────
async function openLedger(clientId, clientName) {
  document.getElementById('ledger-client-name').textContent = clientName;
  document.getElementById('ledger-body').innerHTML = '<div style="text-align:center;padding:30px;color:var(--c-muted);">Loading…</div>';
  openModal('ledgerModal');
  try {
    const res  = await fetch(`${SCRIPT_URL}?action=getLedger&clientId=${clientId}`);
    const data = await res.json();
    renderLedger(data.entries||[]);
  } catch(e) { document.getElementById('ledger-body').innerHTML = '<div style="padding:20px;color:var(--c-danger);">Failed to load ledger.</div>'; }
}

function renderLedger(entries) {
  if (!entries.length) { document.getElementById('ledger-body').innerHTML = '<div style="text-align:center;padding:40px;color:var(--c-muted);"><i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px;opacity:.3;"></i>No ledger entries yet.</div>'; return; }
  let bal = 0;
  let html = entries.map(e => {
    if (e.type==='bill') bal+=e.amount; else bal-=e.amount;
    const f = FIRMS.find(x => x.label === e.firm) || { color:'#64748b', bg:'#f8fafc' };
    return `<div class="ledger-entry">
      <div>
        <div class="ledger-date">${e.date}</div>
        <div class="ledger-desc">${esc(e.desc)}</div>
        <span class="ledger-firm-tag" style="background:${f.bg};color:${f.color}">${esc(e.firm)}</span>
      </div>
      <div style="text-align:right;min-width:80px;">
        <div class="${e.type==='bill'?'ledger-debit':'ledger-credit'}">${e.type==='bill'?'Dr':'Cr'} ₹${fmt(e.amount)}</div>
      </div>
    </div>`;
  }).join('');
  html += `<div style="display:flex;justify-content:space-between;padding:12px 0 0;border-top:2px solid var(--c-border);margin-top:4px;">
    <span style="font-weight:600;">Balance Outstanding</span>
    <span style="font-weight:700;font-size:16px;color:${bal>0?'var(--c-danger)':'var(--c-success)'}">₹${fmt(Math.abs(bal))}</span>
  </div>`;
  document.getElementById('ledger-body').innerHTML = html;
}

// ── ADD CLIENT ────────────────────────────────────────────────────────────
function openAddClientModal() { openModal('addClientModal'); }
async function saveNewClient() {
  const name = document.getElementById('new-client-name').value.trim();
  if (!name) { showToast('Client name is required.', 'error'); return; }
  await postToSheet({ action:'addClient', name,
    group:document.getElementById('new-client-group').value.trim(),
    pan:document.getElementById('new-client-pan').value.trim().toUpperCase(),
    status:document.getElementById('new-client-status').value,
    mobile:document.getElementById('new-client-mobile').value.trim(),
    firm:document.getElementById('new-client-firm').value });
  closeModal('addClientModal');
  showToast(`Client "${name}" added.`, 'success');
  loadData();
}

// ── APPS SCRIPT POST ──────────────────────────────────────────────────────
async function postToSheet(payload) {
  try {
    const res = await fetch(SCRIPT_URL, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    return await res.json();
  } catch(e) { showToast('Network error.', 'error'); return null; }
}

// ── EXPORT ────────────────────────────────────────────────────────────────
function exportCSV() {
  const firmLabels = FIRMS.map(f=>f.label).join(',');
  let csv = `Client,Group,Status,PAN,${firmLabels},Total\n`;
  allClients.forEach(c => {
    const firmVals = FIRMS.map(f => c[f.key]||0).join(',');
    const tot = FIRMS.reduce((s,f)=>s+(c[f.key]||0),0);
    csv += `"${c.name}","${c.group||''}","${c.status||''}","${c.pan||''}",${firmVals},${tot}\n`;
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = `outstanding_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}

// ── UTILS ─────────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal-overlay'))
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
});
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.className = 'toast show' + (type?' '+type:'');
  setTimeout(()=>t.classList.remove('show'), 3500);
}
function fmt(n) { return Math.round(n).toLocaleString('en-IN'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
